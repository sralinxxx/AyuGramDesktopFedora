name: Build AyuGram
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-image-formats-plugins qt6-wayland-dev \
            qt6-svg-dev libqt6svg6-dev \
            libavcodec-dev libavformat-dev libswscale-dev libopus-dev \
            libssl-dev libxxhash-dev liblz4-dev libminizip-dev \
            libx11-dev libxkbcommon-x11-dev libxkbcommon-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-util-dev libxcb-shm0-dev \
            libxcb-render0-dev libxcb-xfixes0-dev libasound2-dev \
            libpulse-dev libva-dev libvdpau-dev libhunspell-dev \
            libwayland-dev libxkbcraft-dev

      - name: Build AyuGram
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Binary
          path: build/AyuGram
